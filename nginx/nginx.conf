server {
    listen 80;
    server_name pexera.online www.pexera.online;
    return 301 https://$host$request_uri;
}

map $http_upgrade $connection_upgrade {
    default     upgrade;
    ''          close;
}

server {
    listen 443 ssl;
    http2 on;

    server_name pexera.online www.pexera.online;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        return 404;
    }

    location /a/ {
        index index.html;
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /a/index.html; # SPAs use this.
        client_max_body_size 32kBi;

        # NESTED RESTRICTION: Only allow standard web assets
        # HTML, JS, CSS, SVG, PNG, JPG, JSON, ICO, WOFF2
        location ~* \.(html|js|css|svg|png|jpg|jpeg|json|ico|woff2)$ {
            # Do nothing here; Nginx will automatically serve the requested file
        }

        # Block every other file extension attempting to load from this directory
        location ~* \.[a-zA-Z0-9]+$ {
            return 404; # Or return 404; if you want to hide file existence
        }
    }

    location /a/ss/ {
        proxy_pass http://voosh-signaling-server:8080/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
