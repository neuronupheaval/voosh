server {
    listen 80;

    location /a {
        client_max_body_size 10k;
        proxy_pass http://frontend-build:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # 2. Route Frontend Development reloads (HMR)
    #location /vite-hmr {
    #    proxy_pass http://frontend-build:5173/vite-hmr;
    #    proxy_http_version 1.1;
    #    proxy_set_header Upgrade $http_upgrade;
    #    proxy_set_header Connection "Upgrade";
    #}

    # 3. Route Your Custom WebSocket Server App
    location /a/ss {
        # 3. Explicitly pass WebSocket upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 4. Standard proxy headers to pass client details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 5. Prevent premature timeouts for idle connections (Crucial)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
