services:
  # 1. Build the frontend assets once and share them with Nginx
  frontend-builder:
    build:
      context: ./voosh-file-xfer
    image: voosh-frontend-assets:latest
    scale: 0 # not going to boot up
    container_name: voosh-frontend-builder
    volumes:
      - content:/dist

  # 2. Node.js WebSocket signaling server
  signaling-server:
    build:
      context: ./voosh-signaling-server
    container_name: voosh-signaling-server
    restart: unless-stopped
    expose:
      - "8080"

  # 3. Nginx reverse proxy + static web server
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    depends_on:
      - signaling-server
      - voosh-frontend-builder
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - content:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_PATH:-/etc/ssl/private/pexera.online/pexera.online.crt}:/etc/nginx/ssl/server.crt:ro
      - ${SSL_CERT_KEY_PATH:-/etc/ssl/private/pexera.online/pexera.online.pem}:/etc/nginx/ssl/server.pem:ro

volumes:
  content: