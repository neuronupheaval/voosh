services:
  # STEP 1 & 2: Compiles text files and shuts down
  frontend-build:
    build: ./frontend
    volumes:
      - dist_volume:/app/dist
    command: sh -c "npm run build && tail -f /dev/null"

  # STEP 3: Stays alive to host the frontend text files
  nginx-server:
    image: nginx:alpine
    ports:
      - "8:8"
    volumes:
      - dist_volume:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # COMBINED: Compiles its own code and immediately runs itself as a server
  websocket-server:
    build: ./ws-server-directory # Docker builds AND runs the server process here
    expose:
      - "8000"
    restart: unless-stopped
