services:
  # 1. Build stage to compile Vite assets
  frontend-builder:
    build:
      context: ./voosh-file-xfer
    image: voosh-frontend-assets:latest
    profiles: donotstart

  # 2. Node.js WebSocket Signaling Server
  signaling-server:
    build:
      context: ./voosh-signaling-server
    container_name: voosh-signaling-server
    restart: unless-stopped
    expose:
      - "8080"

  # 3. Nginx Reverse Proxy + Web Server
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend-builder:
        condition: service_completed_successfully
    volumes:
      # Copy the compiled static frontend files into Nginx
      - ./voosh-file-xfer/dist:/usr/share/nginx/html:ro
      # Mount Nginx routing configuration
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount your SSL Certificates (Map host files to container destination)
      # Hot full path for pexera.online!
      - /etc/ssl/private/pexera.online/pexera.online.crt:/etc/nginx/ssl/server.crt:ro
      - /etc/ssl/private/pexera.online/pexera.online.pem:/etc/nginx/ssl/server.pem:ro
